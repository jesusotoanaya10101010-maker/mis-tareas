<main class="contenedor">
  <h1>Mis tareas</h1>

  <div class="formulario">
    <input
      type="text"
      placeholder="¿Qué tienes que hacer?"
      [(ngModel)]="nuevaTarea"
      (keyup.enter)="agregar()"
    />
    <button (click)="agregar()" [disabled]="!puedeAgregar()">Agregar</button>
  </div>

  <small class="contador" [class.excedido]="palabras() > maxPalabras">
    {{ palabras() }}/{{ maxPalabras }} palabras
  </small>

  @if (tareas().length === 0) {
    <p class="vacio">No hay tareas todavía 🎉</p>
  } @else {
    <ul class="lista">
      @for (tarea of tareas(); track tarea.id) {
        <li>
          <label [class.hecha]="tarea.completada">
            <input
              type="checkbox"
              [checked]="tarea.completada"
              (change)="alternar(tarea.id)"
            />
            {{ tarea.texto }}
          </label>
          <button class="eliminar" (click)="eliminar(tarea.id)">✕</button>
        </li>
      }
    </ul>
  }

  <p class="pendientes">Pendientes: {{ pendientes() }}</p>
</main>
